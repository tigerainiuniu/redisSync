name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    # Python 3.7 is available from setup-python on Ubuntu 22.04, not 24.04.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.7", "3.8", "3.9", "3.12"]

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip<24.1; python_version < '3.8'" "pip; python_version >= '3.8'"
          python -m pip install -e . "pytest>=7,<8" "pytest-github-actions-annotate-failures==0.2.0"
      - name: Run tests
        run: python -m pytest -q -W error
